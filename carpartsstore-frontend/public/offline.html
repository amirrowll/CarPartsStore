<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین - Pinpart Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .offline-container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .offline-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            color: #667eea;
        }
        
        h1 {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 1rem;
        }
        
        p {
            color: #718096;
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border-color: #667eea;
        }
        
        .btn-secondary:hover {
            background: #f7fafc;
            transform: translateY(-2px);
        }
        
        .tips {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
            text-align: right;
        }
        
        .tips h3 {
            color: #2d3748;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
        
        .tips ul {
            list-style: none;
            text-align: right;
        }
        
        .tips li {
            margin-bottom: 0.5rem;
            color: #718096;
            position: relative;
            padding-right: 1.5rem;
        }
        
        .tips li:before {
            content: "•";
            color: #667eea;
            position: absolute;
            right: 0;
        }
        
        @media (max-width: 640px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>
        
        <h1>شما آفلاین هستید</h1>
        <p>اتصال اینترنت شما قطع شده است. برخی از امکانات ممکن است در دسترس نباشند.</p>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                تلاش مجدد
            </button>
            <button class="btn btn-secondary" onclick="window.history.back()">
                بازگشت
            </button>
        </div>
        
        <div class="tips">
            <h3>راهکارهای احتمالی:</h3>
            <ul>
                <li>اتصال Wi-Fi یا اینترنت خود را بررسی کنید</li>
                <li>مودم یا روتر خود را ریستارت کنید</li>
                <li>حالت پرواز را در دستگاه خود خاموش کنید</li>
                <li>مرورگر خود را بروزرسانی کنید</li>
                <li>کش مرورگر را پاک کنید</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Check connection status periodically
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }
        
        // Check every 5 seconds
        setInterval(checkConnection, 5000);
        
        // Listen for online event
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
